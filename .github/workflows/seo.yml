name: Website SEO

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Regenerate and validate the website
        run: |
          node scripts/build-homepage.mjs
          node scripts/build-tools.mjs
          node scripts/build-guides.mjs
          node scripts/apply-seo-patches.mjs
          node scripts/validate-seo.mjs
          node --test scripts/*.test.mjs
          git diff --check
          git diff --exit-code -- index.html guides/ tools/ sitemap.xml robots.txt privacy/ terms/ privacypolicy/
